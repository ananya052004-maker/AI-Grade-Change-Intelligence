# Sec 7.4: "Single container-composed stack (ingest, engine, api, ui, db).
# Runs fully offline." The engine/api/ingest modules all live in one FastAPI
# process for this MVP (see docs/TRACEABILITY_MATRIX.md for why M1-M7/M10/M11
# aren't split into separate containers yet); db is SQLite + Parquet inside
# the backend's own data volume, so there is no separate db service to run.
services:
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    volumes:
      - gci-data:/app/data
    restart: unless-stopped

  frontend:
    build: ./frontend
    ports:
      - "8080:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  gci-data:
